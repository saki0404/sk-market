name: Screen checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 2026-11-18: picomatch ReDoS (GHSA-fc5q-39xc-vjpf) 全系无补丁版本，vite>=6.3 均被牵连（dev-only，
      # 不进入 dist 产物）。阈值临时降至 critical，待 picomatch 发布修复后恢复 `npm audit`。
      - run: npm audit --audit-level=critical
      - run: npm run check
      - run: npm run build
